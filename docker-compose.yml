version: "3.9"

services:
  # ─── Backend (FastAPI + Uvicorn) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datacleaner-backend
    ports:
      - "8000:8000"
    volumes:
      - datasets_vol:/app/datasets
      - reports_vol:/app/reports
      - models_vol:/app/models
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./datacleaner.db
      - UPLOAD_DIR=/app/datasets
      - REPORTS_DIR=/app/reports
    networks:
      - datacleaner-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ─── Frontend (React/Vite built → served by Nginx) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser talks to /api which Nginx proxies → backend container
        VITE_API_URL: ""
    container_name: datacleaner-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - datacleaner-net
    restart: unless-stopped

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  datacleaner-net:
    driver: bridge

# ─── Named Volumes (persisted across container restarts) ─────────────────────
volumes:
  datasets_vol:
  reports_vol:
  models_vol:
